---
- name: Prod to Dev PostgreSQL Database Migration (Via Target Server)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # VIP Tanımları
    default_backup_host: "172.18.42.140"
    default_restore_host: "10.15.42.93"
    
    # Kullanıcı ve Sunucu Bilgileri
    pg_user: "backupadm"
    target_db_server: "172.18.10.131"
    ssh_user: "postgres"
    
    # Disk Yolu
    remote_backup_dir: "/postgres/data/prod_backups"
    
    # Yasaklı Sistem Veritabanları
    restricted_dbs:
      - postgres
      - admin
      - master
      - template0
      - template1

    # Benzersiz İşlem Kimliği (Timestamp)
    run_id: "{{ '%Y%m%d_%H%M%S' | strftime }}"

  pre_tasks:
    - name: "Parametre Kontrolü: DB_NAME girilmiş mi?"
      fail:
        msg: "HATA: Veritabanı adı girilmedi! Lütfen AWX üzerinden taşınacak DB adını girin."
      when: db_names is not defined or db_names == ''

    - name: "Güvenlik Kontrolü: Şifre credential üzerinden geldi mi?"
      fail:
        msg: "HATA: pg_password tanımlı değil! Job Template'e Credential bağlandığından emin olun."
      when: pg_password is not defined or pg_password == ''

    - name: "Veritabanı listesini hazırla"
      set_fact:
        db_list: "{{ db_names.split(',') | map('trim') | select('match', '^.+$') | list }}"

    - name: "Güvenlik Kontrolü: Sistem veritabanı taşınamaz!"
      fail:
        msg: "HATA: Sistem veritabanı ({{ item }}) taşınamaz!"
      when: item | lower in restricted_dbs
      loop: "{{ db_list }}"

    - name: İşlem Bilgilendirmesi
      debug:
        msg: "Taşıma işlemi backupadm kullanıcısıyla 172.18.10.131 üzerinden yürütülecektir."

  tasks:
    - name: Migration ve Restore Ana Bloğu
      block:
        - name: "Adım 1: Hedef sunucuda (/postgres/data) geçici klasör aç"
          shell: >
            ssh -o StrictHostKeyChecking=no {{ ssh_user }}@{{ target_db_server }} "mkdir -p {{ remote_backup_dir }}/{{ run_id }}"

        - name: "Adım 2: Hedef sunucudan Prod VIP'ye bağlanıp pg_dump al"
          shell: >
            ssh -o StrictHostKeyChecking=no {{ ssh_user }}@{{ target_db_server }} "PGPASSWORD='{{ pg_password }}' pg_dump -h {{ backup_db_host | default(default_backup_host) }} -U {{ pg_user }} -d {{ item }} -Fc -f {{ remote_backup_dir }}/{{ run_id }}/{{ item }}_{{ run_id }}.dump"
          loop: "{{ db_list }}"
          no_log: true

        - name: "Adım 3: Hedefte veritabanını oluştur (Yoksa)"
          shell: >
            ssh -o StrictHostKeyChecking=no {{ ssh_user }}@{{ target_db_server }} "psql -U postgres -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = '{{ item }}'\" | grep -q 1 || createdb -U postgres {{ item }}"
          loop: "{{ db_list }}"

        - name: "Adım 4: Hedef sunucuda lokalden pg_restore çalıştır"
          shell: >
            ssh -o StrictHostKeyChecking=no {{ ssh_user }}@{{ target_db_server }} "pg_restore -U postgres -d {{ item }} --clean --if-exists --no-owner --no-privileges {{ remote_backup_dir }}/{{ run_id }}/{{ item }}_{{ run_id }}.dump"
          loop: "{{ db_list }}"
          register: restore_output
          failed_when: restore_output.rc not in [0, 1]

        - name: "İşlem Özeti"
          debug:
            msg: "Veritabanları başarıyla 172.18.10.131 üzerinde restore edildi."

      always:
        - name: "Temizlik: Hedef sunucudaki dump dosyalarını tamamen sil"
          shell: >
            ssh -o StrictHostKeyChecking=no {{ ssh_user }}@{{ target_db_server }} "rm -rf {{ remote_backup_dir }}/{{ run_id }}"
          ignore_errors: yes
