---
- name: Prod to Dev PostgreSQL Database Migration (Via Bridge Server to Dev Target)
  hosts: 10.14.8.18
  gather_facts: false

  vars:
    default_backup_host: "172.18.42.140"
    default_restore_host: "10.15.42.93"
    prod_backup_user: "backupadm"
    dev_db_admin_user: "postgres"
    app_db_owner: "nova_adm"
    remote_backup_dir: "/postgres/data/backup"
    restricted_dbs:
      - postgres
      - admin
      - master
      - template0
      - template1

  pre_tasks:
    - name: "Parametre Kontrolü: DB_NAME girilmiş mi?"
      fail:
        msg: "HATA: Veritabanı adı girilmedi! Lütfen AWX üzerinden taşınacak DB adını girin."
      when: db_names is not defined or db_names == ''

    - name: "Güvenlik Kontrolü: Şifre credential üzerinden geldi mi?"
      fail:
        msg: "HATA: pg_password tanımlı değil! Job Template'e Credential bağlandığından emin olun."
      when: pg_password is not defined or pg_password == ''

    - name: "Veritabanı listesini hazırla ve sabit run_id oluştur"
      set_fact:
        db_list: "{{ db_names.split(',') | map('trim') | select('match', '^.+$') | list }}"
        run_id: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: "Güvenlik Kontrolü: Sistem veritabanı taşınamaz!"
      fail:
        msg: "HATA: Sistem veritabanı ({{ item }}) taşınamaz!"
      when: item | lower in restricted_dbs
      loop: "{{ db_list }}"

    - name: İşlem Bilgilendirmesi
      debug:
        msg: 
          - "Kaynak Prod VIP : {{ backup_db_host | default(default_backup_host) }}"
          - "Hedef Dev DB    : {{ restore_db_host | default(default_restore_host) }}"
          - "İşlem Sunucusu  : 10.14.8.18 (Dizin: {{ remote_backup_dir }}/{{ run_id }})"
          - "DB Sahibi (Owner): {{ app_db_owner }}"
          - "Taşınacak DB'ler: {{ db_list }}"

  tasks:
    - name: Migration ve Restore Ana Bloğu
      block:
        - name: "Adım 1: İşlem sunucusunda geçici backup klasörünü aç"
          shell: >
            mkdir -p {{ remote_backup_dir }}/{{ run_id }}

        - name: "Adım 2: İşlem sunucusu üzerinden Prod VIP'den dump çek"
          shell: >
            pg_dump -h {{ backup_db_host | default(default_backup_host) }} -U {{ prod_backup_user }} -d {{ item }} -Fc -f {{ remote_backup_dir }}/{{ run_id }}/{{ item }}_{{ run_id }}.dump
          environment:
            PGPASSWORD: "{{ pg_password }}"
            PATH: "/usr/pgsql-17/bin:/usr/pgsql-16/bin:/usr/pgsql-15/bin:/usr/pgsql-14/bin:/usr/pgsql-13/bin:/usr/local/bin:/usr/bin:/bin"
          loop: "{{ db_list }}"
          register: dump_result
          failed_when: dump_result.rc != 0

        - name: "Adım 3: Asıl hedef sunucuda ({{ restore_db_host | default(default_restore_host) }}) veritabanını oluştur ve sahibini {{ app_db_owner }} yap"
          shell: >
            psql -h {{ restore_db_host | default(default_restore_host) }} -U {{ dev_db_admin_user }} -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '{{ item }}'" | grep -q 1 || createdb -h {{ restore_db_host | default(default_restore_host) }} -U {{ dev_db_admin_user }} -O {{ app_db_owner }} {{ item }}
          environment:
            PATH: "/usr/pgsql-17/bin:/usr/pgsql-16/bin:/usr/pgsql-15/bin:/usr/pgsql-14/bin:/usr/pgsql-13/bin:/usr/local/bin:/usr/bin:/bin"
          loop: "{{ db_list }}"
          register: createdb_result

        - name: "Adım 4: Asıl hedef sunucuya ({{ restore_db_host | default(default_restore_host) }}) uzaktan pg_restore bas"
          shell: >
            pg_restore -h {{ restore_db_host | default(default_restore_host) }} -U {{ dev_db_admin_user }} -d {{ item }} --clean --if-exists {{ remote_backup_dir }}/{{ run_id }}/{{ item }}_{{ run_id }}.dump
          environment:
            PATH: "/usr/pgsql-17/bin:/usr/pgsql-16/bin:/usr/pgsql-15/bin:/usr/pgsql-14/bin:/usr/pgsql-13/bin:/usr/local/bin:/usr/bin:/bin"
          loop: "{{ db_list }}"
          register: restore_output
          failed_when: restore_output.rc not in [0, 1]

        - name: "Adım 5: Veritabanı sahipliğini {{ app_db_owner }} olarak garantiye al"
          shell: >
            psql -h {{ restore_db_host | default(default_restore_host) }} -U {{ dev_db_admin_user }} -d postgres -c 'ALTER DATABASE "{{ item }}" OWNER TO {{ app_db_owner }};'
          environment:
            PATH: "/usr/pgsql-17/bin:/usr/pgsql-16/bin:/usr/pgsql-15/bin:/usr/pgsql-14/bin:/usr/pgsql-13/bin:/usr/local/bin:/usr/bin:/bin"
          loop: "{{ db_list }}"

        - name: "Restore Logları ve Uyarılar"
          debug:
            msg: "Restore tamamlandı. Çıktı: {{ item.stderr_lines }}"
          loop: "{{ restore_output.results }}"
          when: item.stderr_lines is defined and item.stderr_lines | length > 0

        - name: "İşlem Özeti"
          debug:
            msg: "Tüm veritabanları ({{ db_list }}) başarıyla restore edildi."

      always:
        - name: "Temizlik: İşlem sunucusundaki dump klasörünü tamamen sil"
          shell: >
            rm -rf {{ remote_backup_dir }}/{{ run_id }}
          ignore_errors: yes
