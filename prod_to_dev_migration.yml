---
- name: Prod to Dev PostgreSQL Database Migration (Via Bridge Server to Dev Target)
  hosts: 10.14.8.18
  gather_facts: false
  remote_user: postgres

  vars:
    # Veritabanı Sunucu IP'leri
    default_backup_host: "172.18.42.140"
    default_restore_host: "10.15.42.93"
    
    # DB Seviyesindeki Superuser (Her iki DB'de de bu kullanılır)
    db_super_user: "backupadm"
    app_db_owner: "nova_adm"
    
    # İşletim Sistemi Dizin Tanımları
    remote_backup_dir: "/postgres/data/backup"
    
    # Taşınması Yasaklı Sistem Veritabanları
    restricted_dbs:
      - postgres
      - admin
      - master
      - template0
      - template1

  pre_tasks:
    - name: "Parametre Kontrolü: DB_NAME girilmiş mi?"
      fail:
        msg: "HATA: Veritabanı adı girilmedi! Lütfen AWX üzerinden taşınacak DB adını girin."
      when: db_names is not defined or db_names == ''

    - name: "Güvenlik Kontrolü: backupadm şifresi tanımlı mı?"
      fail:
        msg: "HATA: pg_password tanımlı değil! Job Template'e Credential bağlandığından emin olun."
      when: pg_password is not defined or pg_password == ''

    - name: "Sabit run_id ve veritabanı listesini hazırla"
      set_fact:
        run_id: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
        db_list: "{{ db_names.split(',') | map('trim') | select('match', '^.+$') | list }}"

    - name: "Log dosyası yolunu sabitle"
      set_fact:
        log_file: "{{ remote_backup_dir }}/migration_{{ run_id }}.log"

    - name: "Güvenlik Kontrolü: Sistem veritabanı taşınamaz!"
      fail:
        msg: "HATA: Sistem veritabanı ({{ item }}) taşınamaz!"
      when: item | lower in restricted_dbs
      loop: "{{ db_list }}"

    - name: İşlem Bilgilendirmesi
      debug:
        msg: 
          - "Kaynak Prod VIP : {{ backup_db_host | default(default_backup_host) }}"
          - "Hedef Dev DB    : {{ restore_db_host | default(default_restore_host) }}"
          - "İşlem Sunucusu  : 10.14.8.18 (OS Kullanıcısı: postgres)"
          - "DB Superuser    : {{ db_super_user }}"
          - "DB Sahibi       : {{ app_db_owner }}"
          - "Geçici Dizin    : {{ remote_backup_dir }}/{{ run_id }}"
          - "Log Dosyası     : {{ log_file }}"
          - "Taşınacak DB'ler: {{ db_list }}"

  tasks:
    - name: Migration ve Restore Ana Bloğu
      block:
        - name: "Adım 1: Dizin ve Log dosyasını hazırla"
          shell: >
            mkdir -p {{ remote_backup_dir }}/{{ run_id }} &&
            echo "=== MIGRATION BAŞLADI: $(date) ===" > {{ log_file }}

        - name: "Adım 2: Prod VIP'den dump çek (DB Kullanıcısı: backupadm)"
          shell: >
            echo "--- [$(date)] {{ item }} pg_dump Başlıyor ---" >> {{ log_file }} &&
            /usr/lib/postgresql/17/bin/pg_dump -h {{ backup_db_host | default(default_backup_host) }} -U {{ db_super_user }} -d {{ item }} -Fc -f {{ remote_backup_dir }}/{{ run_id }}/{{ item }}_{{ run_id }}.dump >> {{ log_file }} 2>&1
          environment:
            PGPASSWORD: "{{ pg_password }}"
          loop: "{{ db_list }}"
          register: dump_result

        - name: "Adım 3: Dev sunucusunda veritabanını oluştur (DB Kullanıcısı: backupadm)"
          shell: >
            echo "--- [$(date)] {{ item }} Dev DB Kontrol/Oluşturma ---" >> {{ log_file }} &&
            (/usr/lib/postgresql/17/bin/psql -h {{ restore_db_host | default(default_restore_host) }} -U {{ db_super_user }} -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '{{ item }}'" | grep -q 1 ||
            /usr/lib/postgresql/17/bin/createdb -h {{ restore_db_host | default(default_restore_host) }} -U {{ db_super_user }} -O {{ app_db_owner }} {{ item }}) >> {{ log_file }} 2>&1
          environment:
            PGPASSWORD: "{{ pg_password }}"
          loop: "{{ db_list }}"

        - name: "Adım 4: Dev sunucusuna pg_restore bas (DB Kullanıcısı: backupadm)"
          shell: >
            echo "--- [$(date)] {{ item }} pg_restore Başlıyor ---" >> {{ log_file }} &&
            /usr/lib/postgresql/17/bin/pg_restore -h {{ restore_db_host | default(default_restore_host) }} -U {{ db_super_user }} -d {{ item }} --clean --if-exists {{ remote_backup_dir }}/{{ run_id }}/{{ item }}_{{ run_id }}.dump >> {{ log_file }} 2>&1
          environment:
            PGPASSWORD: "{{ pg_password }}"
          loop: "{{ db_list }}"
          register: restore_output
          failed_when: restore_output.rc not in [0, 1]

        - name: "Adım 5: Veritabanı sahipliğini {{ app_db_owner }} olarak ayarla"
          shell: >
            /usr/lib/postgresql/17/bin/psql -h {{ restore_db_host | default(default_restore_host) }} -U {{ db_super_user }} -d postgres -c 'ALTER DATABASE "{{ item }}" OWNER TO {{ app_db_owner }};' >> {{ log_file }} 2>&1
          environment:
            PGPASSWORD: "{{ pg_password }}"
          loop: "{{ db_list }}"

        - name: "Log Dosyasını Ekrana Yazdır"
          shell: "tail -n 40 {{ log_file }}"
          register: process_logs

        - name: "İşlem Özeti ve Log Çıktısı"
          debug:
            msg: "{{ process_logs.stdout_lines }}"

      rescue:
        - name: "Hata Anında Log Dosyasını Oku"
          shell: "tail -n 50 {{ log_file }}"
          register: error_log_content
          ignore_errors: yes

        - name: "HATA BİLDİRİMİ: Detaylı Log Çıktısı"
          fail:
            msg:
              - "İşlem sırasında hata meydana geldi! İşte son log satırları:"
              - "{{ error_log_content.stdout_lines | default(['Log dosyası okunamadı']) }}"

      always:
        - name: "Temizlik: Yalnızca geçici dump klasörünü sil"
          shell: >
            rm -rf {{ remote_backup_dir }}/{{ run_id }}
          ignore_errors: yes
