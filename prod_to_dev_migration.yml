---
- name: Prod to Dev PostgreSQL Database Migration (Via Bridge Server to Dev Target)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Kaynak ve Hedef DB Hostları
    default_backup_host: "172.18.42.140"
    default_restore_host: "10.15.42.93"
    
    # İşlemi Yönetecek / Dump'ı Barındıracak Köprü Sunucu
    bridge_server: "10.14.8.18"
    ssh_user: "postgres"
    
    # Kullanıcılar
    prod_backup_user: "backupadm"
    dev_db_admin_user: "postgres"
    app_db_owner: "nova_adm"
    
    # Disk Yolu (10.14.8.18 üzerindeki geçici alan)
    remote_backup_dir: "/postgres/data/backup"
    
    # Yasaklı Sistem Veritabanları
    restricted_dbs:
      - postgres
      - admin
      - master
      - template0
      - template1

    # Benzersiz İşlem Kimliği (Timestamp)
    run_id: "{{ '%Y%m%d_%H%M%S' | strftime }}"

  pre_tasks:
    - name: "Parametre Kontrolü: DB_NAME girilmiş mi?"
      fail:
        msg: "HATA: Veritabanı adı girilmedi! Lütfen AWX üzerinden taşınacak DB adını girin."
      when: db_names is not defined or db_names == ''

    - name: "Güvenlik Kontrolü: Şifre credential üzerinden geldi mi?"
      fail:
        msg: "HATA: pg_password tanımlı değil! Job Template'e Credential bağlandığından emin olun."
      when: pg_password is not defined or pg_password == ''

    - name: "Veritabanı listesini hazırla"
      set_fact:
        db_list: "{{ db_names.split(',') | map('trim') | select('match', '^.+$') | list }}"

    - name: "Güvenlik Kontrolü: Sistem veritabanı taşınamaz!"
      fail:
        msg: "HATA: Sistem veritabanı ({{ item }}) taşınamaz!"
      when: item | lower in restricted_dbs
      loop: "{{ db_list }}"

    - name: İşlem Bilgilendirmesi
      debug:
        msg: 
          - "Kaynak Prod VIP : {{ backup_db_host | default(default_backup_host) }}"
          - "Hedef Dev DB    : {{ restore_db_host | default(default_restore_host) }}"
          - "İşlem Sunucusu  : {{ bridge_server }} (Dizin: {{ remote_backup_dir }})"
          - "DB Sahibi (Owner): {{ app_db_owner }}"
          - "Taşınacak DB'ler: {{ db_list }}"

  tasks:
    - name: Migration ve Restore Ana Bloğu
      block:
        - name: "Adım 1: İşlem sunucusunda ({{ bridge_server }}) geçici backup klasörünü aç"
          shell: >
            ssh -o StrictHostKeyChecking=no {{ ssh_user }}@{{ bridge_server }} "mkdir -p {{ remote_backup_dir }}/{{ run_id }}"

        - name: "Adım 2: İşlem sunucusu üzerinden Prod VIP'den dump çek"
          shell: >
            ssh -o StrictHostKeyChecking=no {{ ssh_user }}@{{ bridge_server }} "PGPASSWORD='{{ pg_password }}' pg_dump -h {{ backup_db_host | default(default_backup_host) }} -U {{ prod_backup_user }} -d {{ item }} -Fc -f {{ remote_backup_dir }}/{{ run_id }}/{{ item }}_{{ run_id }}.dump"
          loop: "{{ db_list }}"
          no_log: true
          register: dump_result
          failed_when: dump_result.rc != 0

        - name: "Adım 3: Asıl hedef sunucuda ({{ restore_db_host | default(default_restore_host) }}) veritabanını oluştur ve sahibini {{ app_db_owner }} yap"
          shell: >
            ssh -o StrictHostKeyChecking=no {{ ssh_user }}@{{ bridge_server }} "psql -h {{ restore_db_host | default(default_restore_host) }} -U {{ dev_db_admin_user }} -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = '{{ item }}'\" | grep -q 1 || createdb -h {{ restore_db_host | default(default_restore_host) }} -U {{ dev_db_admin_user }} -O {{ app_db_owner }} {{ item }}"
          loop: "{{ db_list }}"
          register: createdb_result

        - name: "Adım 4: Asıl hedef sunucuya ({{ restore_db_host | default(default_restore_host) }}) uzaktan pg_restore bas"
          shell: >
            ssh -o StrictHostKeyChecking=no {{ ssh_user }}@{{ bridge_server }} "pg_restore -h {{ restore_db_host | default(default_restore_host) }} -U {{ dev_db_admin_user }} -d {{ item }} --clean --if-exists --no-owner --no-privileges {{ remote_backup_dir }}/{{ run_id }}/{{ item }}_{{ run_id }}.dump"
          loop: "{{ db_list }}"
          register: restore_output
          failed_when: restore_output.rc not in [0, 1]

        - name: "Adım 5: Geri yüklenen tüm nesnelerin (tablo, şema, sequence) sahipliğini {{ app_db_owner }} kullanıcısına aktar"
          shell: >
            ssh -o StrictHostKeyChecking=no {{ ssh_user }}@{{ bridge_server }} "psql -h {{ restore_db_host | default(default_restore_host) }} -U {{ dev_db_admin_user }} -d {{ item }} -c \"ALTER DATABASE \\\"{{ item }}\\\" OWNER TO {{ app_db_owner }}; REASSIGN OWNED BY {{ dev_db_admin_user }} TO {{ app_db_owner }};\""
          loop: "{{ db_list }}"

        - name: "Restore Logları ve Uyarılar"
          debug:
            msg: "Restore tamamlandı. Çıktı: {{ item.stderr_lines }}"
          loop: "{{ restore_output.results }}"
          when: item.stderr_lines is defined and item.stderr_lines | length > 0

        - name: "İşlem Özeti"
          debug:
            msg: "Tüm veritabanları ({{ db_list }}) başarıyla restore edildi ve sahipliği {{ app_db_owner }} kullanıcısına devredildi."

      rescue:
        - name: "HATA BİLDİRİMİ: pg_dump Hatası (Şifre gizlenerek basılır)"
          fail:
            msg: "HATA: pg_dump adımında sorun oluştu! Sunucu yanıtı: {{ item.stderr }}"
          loop: "{{ dump_result.results | default([]) }}"
          when: item.failed is defined and item.failed

        - name: "HATA BİLDİRİMİ: Genel Hata"
          fail:
            msg: "Pipeline sırasında beklenmeyen bir hata oluştu! Yukarıdaki task çıktılarını kontrol edin."

      always:
        - name: "Temizlik: İşlem sunucusundaki ({{ bridge_server }}) dump klasörünü tamamen sil"
          shell: >
            ssh -o StrictHostKeyChecking=no {{ ssh_user }}@{{ bridge_server }} "rm -rf {{ remote_backup_dir }}/{{ run_id }}"
          ignore_errors: yes
